<div class="row">
    <div class="col-2">
        <p class="p-1" [ngClass]="divClassName">Div 1</p>
    </div>
    <div class="col-2" [ngClass]="IsCheckBoxIsCheckedOrNot ==true?'bg-secondary':'bg-warning'">
        div-2
    </div>
</div>

<div class="row">
    <div class="col-2">
        <button class="btn btn-success" (click)="changecolor('bg-success')">Green</button>
        <button class="btn btn-danger" (click)="changecolor('bg-danger')">Red</button>
    </div>

    <div class="col-2">
        <input type="checkbox" [(ngModel)]="IsCheckBoxIsCheckedOrNot">
    </div>
</div>
